<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금 즉답 계산기 | 원제우세무사사무소</title>
<style>
  :root{
    --navy:#0d2b2a;
    --teal:#0f6656;
    --teal-light:#e8f3f0;
    --cream:#faf8f4;
    --ink:#1b2320;
    --sub:#5b6b66;
    --line:#d9e3df;
    --warn:#a5470f;
    --warn-bg:#fbeee3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:var(--navy); color:#f2f7f5; padding:22px 20px 18px;
    position:sticky; top:0; z-index:10;
  }
  header h1{margin:0; font-size:19px; letter-spacing:-0.02em;}
  header p{margin:4px 0 0; font-size:12.5px; color:#9fb8b3;}
  .warnbar{
    background:var(--warn-bg); color:var(--warn); font-size:12px;
    padding:9px 16px; border-bottom:1px solid #f0d9c3; line-height:1.5;
  }
  nav{
    display:flex; overflow-x:auto; gap:6px; padding:10px 12px; background:#fff;
    border-bottom:1px solid var(--line); position:sticky; top:76px; z-index:9;
  }
  nav button{
    flex:0 0 auto; border:1px solid var(--line); background:#fff; color:var(--sub);
    padding:8px 14px; border-radius:999px; font-size:13.5px; cursor:pointer;
    font-weight:600; white-space:nowrap;
  }
  nav button.active{ background:var(--teal); border-color:var(--teal); color:#fff; }
  main{ padding:16px; max-width:640px; margin:0 auto 60px; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; margin-bottom:14px;
  }
  .card h2{ font-size:15px; margin:0 0 12px; color:var(--navy); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--sub); margin-bottom:5px; font-weight:600; }
  .field input[type=number], .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:15px; font-family:inherit; background:#fcfcfb;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip-group{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip-group label{
    border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:13px;
    cursor:pointer; color:var(--ink); font-weight:500; background:#fff;
  }
  .chip-group input{ display:none; }
  .chip-group input:checked + span{ font-weight:700; }
  .chip-group label:has(input:checked){ background:var(--teal); border-color:var(--teal); color:#fff; }
  .checkline{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink); margin-bottom:10px;}
  .result{
    background:var(--teal-light); border-radius:12px; padding:16px; margin-top:4px;
  }
  .result .big{ font-size:26px; font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums; }
  .result .biglabel{ font-size:12px; color:var(--sub); font-weight:600; margin-bottom:2px;}
  .breakdown{ margin-top:10px; font-size:12.5px; color:var(--sub); line-height:1.9; }
  .breakdown div{ display:flex; justify-content:space-between; }
  .breakdown b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .note{ font-size:11.5px; color:var(--sub); margin-top:10px; line-height:1.6; }
  .divider{ height:1px; background:var(--line); margin:14px 0; }
  .sumline{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .sumline:last-child{ border-bottom:none; }
  .sumtotal{ font-size:16px; font-weight:800; color:var(--navy); padding-top:8px; }
  .cmp{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; background:#fff; border-radius:10px; overflow:hidden; }
  .cmp th, .cmp td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
  .cmp th{ background:var(--navy); color:#fff; font-size:12px; text-align:center; }
  .cmp td:first-child{ text-align:left; color:var(--sub); font-weight:600; }
  .cmp tr.total td{ font-weight:800; font-size:14px; color:var(--navy); background:var(--teal-light); border-top:2px solid var(--teal); }
  .cmp td.win{ color:var(--teal); font-weight:800; }
  .cmp td.dim{ color:#b7c4c0; }
  .cmp tr.sub td{ font-size:11.5px; color:var(--sub); padding:5px 8px; border-bottom:1px dashed var(--line); }
  .cmp tr.sub td:first-child{ padding-left:16px; font-weight:500; }
  .ratebox{ margin-top:10px; }
  .ratebox details{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:0; overflow:hidden; }
  .ratebox summary{ cursor:pointer; padding:11px 14px; font-size:13px; font-weight:700; color:var(--navy); list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .ratebox summary::after{ content:'▾'; color:var(--sub); font-size:12px; }
  .ratebox details[open] summary::after{ content:'▴'; }
  .ratebox .rt-title{ font-size:11.5px; font-weight:700; color:var(--sub); padding:8px 14px 2px; }
  table.rt{ width:100%; border-collapse:collapse; font-size:12px; }
  table.rt th{ background:var(--teal-light); color:var(--navy); font-size:11.5px; padding:6px 8px; text-align:center; border-bottom:1px solid var(--line); }
  table.rt td{ padding:6px 10px; border-bottom:1px solid var(--line); text-align:right; font-variant-numeric:tabular-nums; }
  table.rt td:first-child{ text-align:left; color:var(--sub); }
  table.rt tr:last-child td{ border-bottom:none; }
  .ratebox .rt-note{ font-size:11px; color:var(--sub); padding:8px 14px 12px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>세금 즉답 계산기</h1>
  <p>상담 중 바로 어림세액 확인 — 원제우세무사사무소</p>
</header>
<div class="warnbar">⚠ 간이 추정 계산입니다. 실제 신고세액은 개별 사실관계(보유·거주기간, 특례, 공제요건 등)에 따라 달라지므로 정식 신고 전 반드시 재검토하세요.</div>

<nav id="tabnav"></nav>
<main>

  <!-- 취득세 -->
  <section class="panel" id="panel-acq">
    <div class="card">
      <h2>취득세 (부동산)</h2>
      <div class="field">
        <label>취득가액</label>
        <input type="text" inputmode="numeric" id="a_value" value="600000000">
      </div>
      <div class="field">
        <label>취득 원인</label>
        <div class="chip-group" id="a_cause"></div>
      </div>
      <div class="field" id="a_housewrap">
        <label>주택 수 (취득 후 기준) — 유상취득 시</label>
        <div class="chip-group" id="a_house"></div>
      </div>
      <div class="field" id="a_inheritcntwrap" style="display:none;">
        <label>상속인의 상속개시 당시 주택 보유 현황</label>
        <div class="chip-group" id="a_inheritcnt"></div>
      </div>
      <div class="checkline" id="a_adjustedline"><input type="checkbox" id="a_adjusted"> 조정대상지역 소재</div>
      <div class="checkline"><input type="checkbox" id="a_over85"> 전용면적 85㎡ 초과 (농특세 0.2%p 추가)</div>
    </div>
    <div class="card result" id="a_result"></div>
  </section>

</main>

<script>
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';

// 콤마 입력 헬퍼
function numVal(id){
  const el = document.getElementById(id);
  return Number((el.value||'0').replace(/[^0-9]/g,''))||0;
}
function attachComma(id, onChange){
  const el = document.getElementById(id);
  const format = () => {
    const digits = el.value.replace(/[^0-9]/g,'');
    const prevLen = el.value.length;
    const cursorFromEnd = prevLen - el.selectionStart;
    el.value = digits === '' ? '' : Number(digits).toLocaleString('ko-KR');
    const newPos = Math.max(el.value.length - cursorFromEnd, 0);
    el.setSelectionRange(newPos, newPos);
  };
  format();
  el.addEventListener('input', ()=>{ format(); if(onChange) onChange(); });
}

// ---- tabs ----
const tabs = [{id:'acq', label:'취득세'}];
const nav = document.getElementById('tabnav');
tabs.forEach((t,i)=>{
  const b = document.createElement('button');
  b.textContent = t.label;
  b.className = 'active';
  nav.appendChild(b);
});
document.getElementById('panel-acq').classList.add('active');

function chipGroup(container, options, defaultVal, onChange){
  const el = document.getElementById(container);
  if(!el) return;
  el.innerHTML='';
  const name = container+'_radio';
  options.forEach((o,idx)=>{
    const lbl = document.createElement('label');
    const inp = document.createElement('input');
    inp.type='radio'; inp.name=name; inp.value=o.value;
    if(o.value===defaultVal) inp.checked=true;
    const span = document.createElement('span'); span.textContent=o.label;
    lbl.appendChild(inp); lbl.appendChild(span);
    inp.onchange = onChange;
    el.appendChild(lbl);
  });
}
function chipVal(container){
  const name = container+'_radio';
  const checked = document.querySelector(`input[name="${name}"]:checked`);
  return checked ? checked.value : null;
}

// ===================== 취득세 (수정됨) =====================
chipGroup('a_cause', [
  {value:'sale', label:'매매(유상)'},
  {value:'gift', label:'증여'},
  {value:'inherit', label:'상속'},
], 'inherit', renderAcq);
chipGroup('a_house', [
  {value:'1', label:'1주택'},
  {value:'2', label:'2주택'},
  {value:'3', label:'3주택'},
  {value:'4+', label:'4주택+/법인'},
], '1', renderAcq);
chipGroup('a_inheritcnt', [
  {value:'none', label:'무주택'},
  {value:'1', label:'1주택'},
  {value:'2', label:'2주택'},
  {value:'3', label:'3주택+'},
], 'none', renderAcq);

function acqRateSale(value, houseCnt, adjusted, over85){
  if(houseCnt==='1' && !(adjusted)){
    let base;
    if(value<=600000000) base=0.01;
    else if(value<=900000000){
      const eok = value/100000000;
      base = (eok*2/3 - 3)/100;
    } else base=0.03;
    const extra = over85?0.002:0;
    const localEdu = 0.001*(value<=600000000?1: value<=900000000?2:3);
    return {rate: base+extra+localEdu, note:'1주택/무주택 일반세율(6~9억 구간 근사 산식 포함)'};
  }
  if(houseCnt==='1' && adjusted){
    return acqRateSale(value,'1',false,over85);
  }
  if(houseCnt==='2'){
    if(adjusted){
      return {rate: over85?0.09:0.084, note:'조정대상지역 2주택 중과세율'};
    }
    return acqRateSale(value,'1',false,over85);
  }
  if(houseCnt==='3'){
    if(adjusted) return {rate: over85?0.134:0.124, note:'조정대상지역 3주택 중과세율'};
    return {rate: over85?0.09:0.084, note:'비조정 3주택 중과세율'};
  }
  return {rate: over85?0.134:0.124, note:'4주택 이상/법인 중과세율'};
}

function renderAcq(){
  const value = numVal('a_value');
  const cause = chipVal('a_cause');
  const houseCnt = chipVal('a_house');
  const inheritCnt = chipVal('a_inheritcnt');
  const adjusted = document.getElementById('a_adjusted').checked;
  const over85 = document.getElementById('a_over85').checked;

  document.getElementById('a_housewrap').style.display = cause==='sale' ? 'block':'none';
  document.getElementById('a_inheritcntwrap').style.display = cause==='inherit' ? 'block':'none';
  document.getElementById('a_adjustedline').style.display = 'flex';

  let rate, note;
  if(cause==='sale'){
    const r = acqRateSale(value, houseCnt, adjusted, over85);
    rate=r.rate; note=r.note;
  } else if(cause==='gift'){
    if(adjusted && value>=300000000 && !over85){
      rate = 0.12; note='조정대상지역 3억 이상 주택 증여 취득세율';
    } else if(adjusted && value>=300000000 && over85){
      rate = 0.134; note='조정대상지역 3억 이상 주택 증여 취득세율(85㎡ 초과)';
    } else {
      rate = over85?0.04:0.035; note='일반 증여 취득세율';
    }
  } else { // inherit
    if(inheritCnt === 'none') {
      // 무주택: 0.96% (0.8% 취득세 + 0.16% 지방교육세)
      rate = 0.0096;
      note = '무주택(1가구 1주택 특례) 상속 취득세율 0.96%';
    } else {
      // 1주택 이상(다주택): 3.16% (2.8% 취득세 + 0.16% 지방교육세 + 0.2% 농특세)
      rate = 0.0316;
      note = '1주택 이상(다주택) 상속 취득세율 3.16%';
    }
  }
  const tax = value*rate;
  document.getElementById('a_result').innerHTML = `
    <div class="biglabel">예상 취득세 등 총액 (농특세·지방교육세 포함)</div>
    <div class="big">${won(tax)}</div>
    <div class="breakdown">
      <div><span>취득가액</span><b>${won(value)}</b></div>
      <div><span>적용세율</span><b>${(rate*100).toFixed(2)}%</b></div>
      <div><span>적용구분</span><b>${note}</b></div>
    </div>
    <div class="note">상속취득세는 상속인의 상속개시 당시 주택 보유 현황에 따라 세율이 달라집니다. 6~9억 구간 유상취득 세율은 근사 산식이며, 정확한 세액은 지방세법 시행령 별표 및 위택스 계산기로 재확인 권장.</div>
  `;
}

attachComma('a_value', renderAcq);
['a_cause','a_adjusted','a_over85','a_inheritcnt'].forEach(id=>{
  const el = document.getElementById(id);
  if(el){
    el.addEventListener('input', renderAcq);
    el.addEventListener('change', renderAcq);
  }
});

renderAcq();
</script>
</body>
</html>
